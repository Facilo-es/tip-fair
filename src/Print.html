<!DOCTYPE html>
<html><head><base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@700&display=swap">
<style>
/* Tip Fair documents: A4 pages, one per statement, printed with the browser's own dialog. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/18px Arial,sans-serif;color:#202124;display:flex;flex-direction:column}
.tf-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #e0e0e0}
.tf-bar span{color:#5f6368}
.tf-btn{background:#1a73e8;color:#fff;border:0;border-radius:4px;height:36px;padding:0 20px;font:500 14px Arial,sans-serif;cursor:pointer}
.tf-btn:hover{background:#1765cc}
.tf-page{width:595px;min-height:842px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none;color:#111}
.tf-doc{padding:56px 60px;font:14px/1.5 Geist,Arial,sans-serif}
.tf-doc h1{font-size:24px;line-height:1.2;margin:0 0 18px}
.tf-doc h2{font-size:18px;margin:22px 0 8px}
.tf-doc h3{font-size:13px;margin:16px 0 2px}
.tf-doc p{margin:0 0 8px}
.tf-doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px;font-variant-numeric:tabular-nums}
.tf-doc th,.tf-doc td{border-bottom:1px solid #ccc;padding:5px 4px;text-align:right}
.tf-doc th:first-child,.tf-doc td:first-child{text-align:left}
.tf-doc tfoot td{font-weight:700;border-top:2px solid #111}
.tf-dv{font-weight:700;font-size:16px;margin-bottom:18px!important}
.tf-sig{margin-top:28px!important}
.tf-fine{font-size:11px;color:#555;margin-top:24px!important}
.tf-poster{text-align:center;padding-top:120px}
.tf-poster h1{font-size:40px}
.tf-big{font-size:22px;line-height:1.35;margin:24px 0 18px!important}
/* statement: payslip insert */
.a-st{padding:0;font:13px/1.45 Geist,Arial,sans-serif;color:#111}
.a-st .hd{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 44px 16px;border-bottom:3px solid #111}
.a-st .hd b{font-size:20px;letter-spacing:-.01em}
.a-st .hd span{font:600 11px Geist,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.a-st .bd{padding:22px 44px 30px}
.a-st dl{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;margin:0 0 22px}
.a-st dt{color:#555}
.a-st dd{margin:0;font-weight:600}
.a-st .sh{border:1.5px solid #111;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin:0 0 22px}
.a-st .sh span{font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.a-st .sh b{font:700 38px/1 "Geist Mono",monospace;letter-spacing:-.02em}
.a-st h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}
.a-st .how p{margin:0 0 4px}
.a-st .ft{border-top:1px solid #999;margin-top:22px;padding-top:10px;font-size:11px;color:#444}
.a-st .ft p{margin:0 0 3px}
.a-st i{display:block;font-style:normal;font-size:10px;color:#666;font-weight:400;text-transform:none;letter-spacing:0}
.a-st .cut{border-top:1.5px dashed #999;margin:0 22px;position:relative}
@media print{
  @page{size:A4;margin:0}
  .tf-bar{display:none}
  body{display:block}
  .tf-pages{padding:0;background:none;gap:0;display:block;overflow:visible}
  .tf-page{box-shadow:none;width:auto;min-height:0;page-break-after:always;break-after:page}
  .tf-page:last-child{page-break-after:auto;break-after:auto}
}
</style></head><body>
<div class="tf-bar"><span>Check it, then print or save as PDF.</span><button class="tf-btn" onclick="window.print()">Print</button></div>
<div class="tf-pages"><?!= data ?></div>
</body></html>
